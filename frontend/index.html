<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifelive Dashboard</title>
<meta name="theme-color" content="#1b1d22">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
  <h1><img class="logo logo-on-dark" src="logo-light.png" alt="Lifelive" width="160" height="20"><img class="logo logo-on-light" src="logo-dark.png" alt="Lifelive" width="160" height="20"><span>Dashboard</span></h1>
  <div class="controls">
    <select id="period" aria-label="Période">
      <option value="ytd">Année en cours</option>
      <option value="month">Mois en cours</option>
      <option value="prev">Année précédente</option>
      <option value="12m">12 derniers mois</option>
    </select>
    <button id="refresh" title="Actualiser" aria-label="Actualiser">↻</button>
  </div>
</header>
<div id="status"></div>
<div id="login" hidden><div id="g_btn"></div></div>
<div id="app" hidden>
  <nav id="nav" aria-label="Rubriques"></nav>
  <div id="backdrop"></div>
  <main>
    <h2 id="page-title"></h2>
    <div id="page"></div>
    <footer id="foot"></footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
